# Keep config access compatible with User=nobody, including after a manual atomic replacement.
# The + prefix runs only chmod as root. Xray's own preflight runs as the service user.
[Service]
ExecStartPre=+/usr/bin/chmod 0644 /usr/local/etc/xray/config.json
ExecStartPre=/usr/local/bin/xray run -test -c /usr/local/etc/xray/config.json
