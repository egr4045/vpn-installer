# VPN/proxy network tuning — added for YouTube throughput & stability
# Large socket buffers for high-BDP streaming through the proxy (was 208KB default)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216

# BBR + fq (fq is the qdisc BBR is designed for; was fq_codel on the NIC)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Streaming/latency niceties
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.ipv4.tcp_notsent_lowat = 131072

# Reduce swap pressure on this 1.8GB box (was 60)
vm.swappiness = 10

# RFS global flow table (per-queue rps_flow_cnt + rps_cpus set by vpn-net-tuning.service)
# Spreads NET_RX softirq across both cores (single NIC rx-queue was pinning CPU0).
net.core.rps_sock_flow_entries = 32768
