# SafeChill: keep xray's access log long enough to answer "did X break for Y at 14:20 last Tuesday",
# and no longer. Without this journald is capped only by size (10% of the filesystem), so a busy week
# silently evicts the older half of it — the opposite of what a support question needs.
# Measured at loglevel=info: ~580k lines/day on the exit, ~430k on the entry, so eight days is ~3 GB.
[Journal]
Storage=persistent
MaxRetentionSec=8day
SystemMaxUse=4G
SystemMaxFileSize=128M
